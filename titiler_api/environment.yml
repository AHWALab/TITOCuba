name: titiler-ahwa
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Core raster I/O (GDAL bindings)
  - rasterio>=1.3
  - gdal>=3.6
  # Web framework
  - fastapi>=0.110
  - uvicorn>=0.29
  - python-multipart
  # Image processing
  - pillow>=10.0
  # Numerical
  - numpy>=1.24
  # Utilities
  - httpx
  - pydantic>=2.0
  # Optional: COG creation / validation
  - rio-cogeo>=5.0
  - pip:
      - titiler>=0.18
